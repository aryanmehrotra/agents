global:
  scrape_interval: 5s

scrape_configs:
  - job_name: agents
    static_configs:
      - targets:
          - "host.docker.internal:2121"  # data-agent
          - "host.docker.internal:2122"  # support-agent
          - "host.docker.internal:2123"  # kb-agent
          - "host.docker.internal:2124"  # orchestrator
          - "host.docker.internal:2125"  # code-review-agent
          - "host.docker.internal:2126"  # pii-redaction-agent
          - "host.docker.internal:2127"  # summarizer-agent
          - "host.docker.internal:2128"  # memory-agent
          - "host.docker.internal:2129"  # sql-agent
          - "host.docker.internal:2130"  # research-agent
          - "host.docker.internal:2131"  # extraction-agent
          - "host.docker.internal:2132"  # local-rag-agent
          - "host.docker.internal:2133"  # scheduler-agent
          - "host.docker.internal:2134"  # workflow-agent
          - "host.docker.internal:2135"  # spec-agent
          - "host.docker.internal:2136"  # estimation-agent
          - "host.docker.internal:2137"  # scaffold-agent
          - "host.docker.internal:2138"  # migration-agent
          - "host.docker.internal:2139"  # test-gen-agent
          - "host.docker.internal:2140"  # flaky-test-agent
          - "host.docker.internal:2141"  # breaking-change-agent
